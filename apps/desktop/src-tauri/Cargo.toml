[package]
name = "teamwright-desktop"
description = "The Teamwright desktop application: the shell that connects the interface to the use cases."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
teamwright-application.workspace = true
teamwright-domain.workspace = true
teamwright-integrations.workspace = true
teamwright-runtime.workspace = true
teamwright-storage.workspace = true
teamwright-workbook.workspace = true

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
# The windows of the operating system for choosing a folder or files.
tauri-plugin-dialog = "2"
# The notifications of the operating system, sent from the shell.
tauri-plugin-notification = "2"
# Downloads a signed update, checks its signature against the public key in
# tauri.conf.json, and installs it (decision 0045).
tauri-plugin-updater = "2"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
