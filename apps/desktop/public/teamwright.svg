<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Teamwright">
  <!-- A letter T laid out of building blocks. The three blocks of the top
       row are the specialists of a team, each in a color of its own. -->
  <rect width="1024" height="1024" rx="224" fill="#16171d" />
  <rect x="224" y="224" width="176" height="176" rx="40" fill="#7c8cff" />
  <rect x="424" y="224" width="176" height="176" rx="40" fill="#3ecf8e" />
  <rect x="624" y="224" width="176" height="176" rx="40" fill="#f5b041" />
  <rect x="424" y="424" width="176" height="176" rx="40" fill="#e9eaf0" />
  <rect x="424" y="624" width="176" height="176" rx="40" fill="#e9eaf0" />
</svg>
