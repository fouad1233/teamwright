[package]
name = "teamwright-runtime"
description = "Runs Teamwright's team members on the user's own Claude Code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
teamwright-application.workspace = true
teamwright-domain.workspace = true

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
