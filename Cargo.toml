[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Versions of third-party crates are declared once, here, and inherited by the
# member crates so the whole workspace always agrees on them.
[workspace.dependencies]
teamwright-application = { path = "crates/application" }
teamwright-domain = { path = "crates/domain" }
teamwright-runtime = { path = "crates/runtime" }
teamwright-storage = { path = "crates/storage" }

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# SQLite is compiled into the program, so users need no database installed.
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
# An exception needs `#[expect(unsafe_code, reason = "...")]` and a review.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
# Smaller and faster release builds at the price of a longer build.
codegen-units = 1
lto = true
strip = true
